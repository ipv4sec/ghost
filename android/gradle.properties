org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 旧式 DSL 工程：走 Flutter 插件的兼容路径（Flutter 迁移器同款标记）
android.builtInKotlin=false
android.newDsl=false
# Windows 跨盘符（pub 缓存在 C:、工程在 D:）：Kotlin 2.4 增量编译的
# relocatable 缓存换算相对路径时崩溃（toRelativeString 跨根抛异常），
# 关掉增量编译绕过；只影响编译速度，不影响产物
kotlin.incremental=false
# AGP 9 默认强制各库 manifest 命名空间唯一，但 cronet-api 与
# cronet-shared 合法共用 org.chromium.net（同一 API 的不同实现 AAR），
# 按官方文档过渡期关掉该检查
android.uniquePackageNames=false
